openapi: 3.0.3
info:
  title: YL Sport Tights - Payment API
  description: |
    API endpoints for Cardcom payment gateway integration.
    Handles payment redirect, callback processing, and payment status queries.
  version: 1.0.0
  contact:
    name: YL Sport Development Team
    email: dev@yl-sport.com

servers:
  - url: https://yl-sport.vercel.app/api
    description: Production server
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Payment Flow
    description: Cardcom payment integration endpoints

paths:
  /payment/cardcom-redirect:
    get:
      tags:
        - Payment Flow
      summary: Redirect to Cardcom payment gateway
      description: |
        Generates Cardcom payment URL and redirects customer to Cardcom hosted payment page.
        This endpoint is called after order creation when customer clicks "Continue to Payment".
        Cardcom redirect URL includes order details, amount, and callback URL.
      operationId: redirectToCardcom
      parameters:
        - name: orderId
          in: query
          description: Order ID (internal CUID)
          required: true
          schema:
            type: string
            example: clxyz123abc
      responses:
        '302':
          description: Redirect to Cardcom payment page
          headers:
            Location:
              description: Cardcom payment gateway URL
              schema:
                type: string
                example: https://secure.cardcom.solutions/Interface/LowProfile.aspx?token=abc123xyz
        '400':
          description: Invalid order ID or order already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                orderNotFound:
                  value:
                    error: הזמנה לא נמצאה
                    code: ORDER_NOT_FOUND
                orderAlreadyPaid:
                  value:
                    error: ההזמנה כבר שולמה
                    code: ORDER_ALREADY_PAID
        '500':
          description: Cardcom API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: שגיאה בתקשורת עם שער התשלום
                code: PAYMENT_GATEWAY_ERROR

  /payment/cardcom-callback:
    post:
      tags:
        - Payment Flow
      summary: Cardcom payment callback
      description: |
        Webhook endpoint called by Cardcom after payment attempt (success or failure).
        Updates order payment status, triggers email/SMS notifications on success.
        **This endpoint is called by Cardcom servers, not by the client.**
      operationId: handleCardcomCallback
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - InvoiceResponse
                - DealResponse
                - OperationResponse
                - InternalDealNumber
              properties:
                InvoiceResponse:
                  type: string
                  description: Invoice ID from Cardcom
                  example: "12345678"
                DealResponse:
                  type: string
                  description: Transaction ID from Cardcom
                  example: "87654321"
                OperationResponse:
                  type: string
                  description: Operation result code (0 = success, other = failure)
                  example: "0"
                InternalDealNumber:
                  type: string
                  description: Our order ID (passed to Cardcom in redirect)
                  example: clxyz123abc
                OperationResponseText:
                  type: string
                  description: Human-readable operation result
                  example: "Success"
                CardNumber:
                  type: string
                  description: Masked card number (last 4 digits)
                  example: "****1234"
                CardExpiration:
                  type: string
                  description: Card expiration (MM/YY)
                  example: "12/25"
                Amount:
                  type: string
                  description: Payment amount in ILS
                  example: "279.00"
      responses:
        '200':
          description: Callback processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  orderNumber:
                    type: string
                    description: Customer-facing order number
                    example: "001"
                  redirectUrl:
                    type: string
                    description: URL to redirect customer to
                    example: /order-confirmation?orderNumber=001
        '400':
          description: Invalid callback data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payment/status/{orderId}:
    get:
      tags:
        - Payment Flow
      summary: Get payment status
      description: |
        Check payment status for a specific order.
        Used for polling payment status or verifying successful payment.
        Public endpoint (no auth required).
      operationId: getPaymentStatus
      parameters:
        - name: orderId
          in: path
          description: Order ID (internal CUID)
          required: true
          schema:
            type: string
            example: clxyz123abc
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
              examples:
                completed:
                  value:
                    orderId: clxyz123abc
                    orderNumber: "001"
                    paymentStatus: COMPLETED
                    amount: 279.00
                    cardLast4: "1234"
                    transactionId: "87654321"
                    paidAt: "2025-10-21T10:35:00Z"
                pending:
                  value:
                    orderId: clxyz123abc
                    orderNumber: "001"
                    paymentStatus: PENDING
                    amount: 279.00
                    cardLast4: null
                    transactionId: null
                    paidAt: null
                failed:
                  value:
                    orderId: clxyz123abc
                    orderNumber: "001"
                    paymentStatus: FAILED
                    amount: 279.00
                    cardLast4: null
                    transactionId: null
                    paidAt: null
                    failureReason: כרטיס נדחה - יתרה לא מספקת
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    PaymentStatusResponse:
      type: object
      properties:
        orderId:
          type: string
          description: Internal order ID
          example: clxyz123abc
        orderNumber:
          type: string
          description: Customer-facing order number
          example: "001"
        paymentStatus:
          type: string
          enum:
            - PENDING
            - COMPLETED
            - FAILED
            - REFUNDED
          description: Payment status
          example: COMPLETED
        amount:
          type: number
          format: decimal
          description: Payment amount in ILS
          example: 279.00
        cardLast4:
          type: string
          nullable: true
          description: Last 4 digits of card (if payment completed)
          example: "1234"
        transactionId:
          type: string
          nullable: true
          description: Cardcom transaction ID (if payment completed)
          example: "87654321"
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: Payment completion timestamp
          example: "2025-10-21T10:35:00Z"
        failureReason:
          type: string
          nullable: true
          description: Failure reason (if payment failed, in Hebrew)
          example: כרטיס נדחה - יתרה לא מספקת

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message in Hebrew
          example: הזמנה לא נמצאה
        code:
          type: string
          description: Machine-readable error code
          example: ORDER_NOT_FOUND
        details:
          type: object
          description: Additional error details
          additionalProperties: true

externalDocs:
  description: Cardcom API Documentation
  url: https://developers.cardcom.co.il/

# Note: Cardcom integration details
#
# Cardcom API Credentials (stored in environment variables):
# - CARDCOM_TERMINAL_NUMBER: Terminal ID provided by Cardcom
# - CARDCOM_API_USERNAME: API username
# - CARDCOM_API_PASSWORD: API password (or API key for newer integrations)
#
# Cardcom Endpoints:
# - Sandbox: https://secure.cardcom.solutions/Interface/LowProfile.aspx
# - Production: https://secure.cardcom.solutions/Interface/LowProfile.aspx
#
# Integration Flow:
# 1. Customer completes checkout form → Order created in database (status: PENDING_PAYMENT)
# 2. Customer clicks "Continue to Payment" → GET /payment/cardcom-redirect?orderId=xxx
# 3. Server calls Cardcom API to create payment token
# 4. Server redirects customer to Cardcom hosted payment page with token
# 5. Customer enters card details on Cardcom page
# 6. Cardcom processes payment and calls POST /payment/cardcom-callback with result
# 7. Server updates order status based on callback:
#    - OperationResponse = "0" → paymentStatus = COMPLETED, status = PAID, send confirmation email/SMS
#    - OperationResponse != "0" → paymentStatus = FAILED, status = CANCELLED
# 8. Server responds with redirect URL → Cardcom redirects customer to /order-confirmation or /payment-failed
#
# Security Considerations:
# - Cardcom callback IP whitelist: Verify callback originates from Cardcom servers
# - Signature verification: Validate Cardcom callback signature (if configured)
# - Amount verification: Ensure callback amount matches order total
# - Idempotency: Handle duplicate callbacks (check if order already marked as paid)
